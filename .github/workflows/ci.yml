name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm audit --audit-level=high
      - run: npm run build
      - name: Check bundle size budget (< 150 KB gzipped)
        run: npm run check:bundle
      - name: Verify no secrets leaked into client bundle
        run: npm run verify:secrets
      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests (blocking per Phase 24)
        run: npm run test:e2e
      - name: Run Lighthouse CI (blocking per Phase 22)
        run: npx lhci autorun
