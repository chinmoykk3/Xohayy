name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm audit --audit-level=high
      - run: npm run build
      # TODO: Phase 24 will make e2e and lhci blocking in CI
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E smoke tests (non-blocking until Phase 24)
        run: npm run test:e2e
        continue-on-error: true
      - name: Run Lighthouse CI (non-blocking until Phase 24)
        run: npx lhci autorun
        continue-on-error: true
